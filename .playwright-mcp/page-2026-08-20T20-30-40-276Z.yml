            - article [ref=f2376e544]:
              - generic [ref=f2376e545]:
                - generic [ref=f2376e546]:
                  - text: KEY TAKEAWAYS
                  - img "ChevronUp icon" [ref=f2376e548] [cursor=pointer]
                - list [ref=f2376e550]:
                  - listitem [ref=f2376e551]: Brayden Jarrett swam 19.5 miles across Bear Lake in 11 hours.
                  - listitem [ref=f2376e552]: Jarrett plans to swim the English Channel in June 2027, a 21-mile challenge.
                  - listitem [ref=f2376e553]: He trains at Utah State University and Hyrum Reservoir to prepare for this feat.
              - generic [ref=f2376e554]:
                - paragraph [ref=f2376e555]: GARDEN CITY, Rich County — Brayden Jarrett reached a major milestone as an open water swimmer Saturday — spanning the length of Bear Lake, 19.5 miles, in just over 11 hours.
                - paragraph [ref=f2376e556]: "\"It felt amazing,\" Jarrett said. \"Just that feeling of, you know, you did something. You did something hard.\""
                - paragraph [ref=f2376e557]: Jarrett's journey started early Saturday morning. He was followed on a jet ski by his father and Gordon Gridley, a Davis County swimmer who serves as an official for the Marathon Swimming Federation, which is expected to ultimately ratify his accomplishment in the coming weeks. During the first several hours, he said his training supported him well.
                - 'figure "Brayden Jarrett was accompanied and guided by a jet ski at Bear Lake on Saturday. (Photo: Gordon Gridley)" [ref=f2376e558]':
                  - generic "Brayden Jarrett was accompanied and guided by a jet ski at Bear Lake on Saturday." [ref=f2376e559] [cursor=pointer]:
                    - img "Brayden Jarrett was accompanied and guided by a jet ski at Bear Lake on Saturday." [ref=f2376e561]
                - paragraph [ref=f2376e563]: "\"I got in the water, and I just started swimming, and it was really boring, let me tell you. Really, really boring,\" Jarrett laughed. That ultimately changed, however. \"5.5 hours in, there was a thunderstorm coming in. The waters were really rough, and I just had to push through it\""
                - paragraph [ref=f2376e567]: Jarrett said his shoulders became sore, but he persisted. Gridley and his father provided moral support, food and water.
                - paragraph [ref=f2376e568]: "\"Sometimes you hit a wall, you don't want to go anymore, but you know, they're there right next to you cheering you on,\" he said."
                - paragraph [ref=f2376e569]: And in that lies, in large part, why Jarrett loves swimming on the open water so much.
                - paragraph [ref=f2376e570]: "\"That's just mainly what it taught me, is that I'm in control of my circumstances,\" he said. \"Like, if I want to do this, then I can do it. There's nothing stopping me.\""
                - paragraph [ref=f2376e571]: Jarrett's love for swimming started at a very young age, but his ambitions for open water came more recently as he set his sights on the English Channel, which is about 21 miles across at the narrowest portion.
                - paragraph [ref=f2376e572]: "\"It's been four years that I've had that goal in my mind, but I haven't really thought too much about it until this past year,\" Jarrett explained."
                - paragraph [ref=f2376e573]: He said that in that goal, there are greater challenges ahead, and more reasons to train.
                - 'figure "Brayden Jarrett at Hyrum Reservoir on Tuesday, where he often trains for his open water swims. (Photo: Mike Anderson, KSL)" [ref=f2376e574]':
                  - generic "Brayden Jarrett at Hyrum Reservoir on Tuesday, where he often trains for his open water swims." [ref=f2376e575] [cursor=pointer]:
                    - img "Brayden Jarrett at Hyrum Reservoir on Tuesday, where he often trains for his open water swims." [ref=f2376e577]
                - paragraph [ref=f2376e579]: "\"In the ocean, the currents are going to be probably a lot more stronger,\" Jarrett said. \"The English Channel, that's a big shipping lane. There's going to be big vessels. There's going to be a big boat next to me guiding me, and there's going to be saltwater, and it's going to be cold.\""
                - paragraph [ref=f2376e580]: Jarrett regularly trains at the pool inside the HPER building at Utah State University, and in Hyrum Reservoir. Ahead of taking on the channel, however, he'll need to swim for six hours around Alcatraz this November, for a continuous swim in water that is 61 degrees or colder.
                - paragraph [ref=f2376e581]: In the Meantime, his journey between England and France is set for June 2027, as those swims are in high enough demand that they need to be set up three years in advance. Still, Jarrett is confident that he will be ready, as long as he keeps setting goals and reaching them along the way. That's also a part of the process that he loves.
                - paragraph [ref=f2376e585]: "\"It just helps me feel purpose,\" Jarrett said. \"Because when you do something hard like that mental aspect, what it gives you is just no other feeling. I don't know how to describe it.\""
