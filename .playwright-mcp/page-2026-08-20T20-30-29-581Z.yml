            - article [ref=f2278e548]:
              - generic [ref=f2278e549]:
                - generic [ref=f2278e550]:
                  - text: KEY TAKEAWAYS
                  - img "ChevronUp icon" [ref=f2278e552] [cursor=pointer]
                - list [ref=f2278e554]:
                  - listitem [ref=f2278e555]: Utah's FrontRunner 2X project advances to the engineering phase for $1.3 billion funding.
                  - listitem [ref=f2278e556]: Sen. Curtis emphasizes public transit's role in handling temple open house and Olympics.
                  - listitem [ref=f2278e557]: Transit-oriented development aims to boost housing affordability and support Utah's growth.
              - generic [ref=f2278e558]:
                - paragraph [ref=f2278e559]: SALT LAKE CITY — As Utah prepares to host millions of visitors for the Salt Lake Temple open house and the 2034 Winter Olympics, its railways are undergoing a major change.
                - paragraph [ref=f2278e560]:
                  - text: The Federal Transit Administration recently approved the
                  - link "FrontRunner 2X" [ref=f2278e561] [cursor=pointer]:
                    - /url: https://connect.udot.utah.gov/2026/08/07/frontrunner-2x-advances-to-final-phase-of-process-for-nearly-1-3-billion-federal-grant/
                  - text: project to enter the engineering phase, moving it one step closer to securing nearly $1.3 billion in federal funding. The project will add 26.1 miles of double tracks in 11 locations in Utah, which would support trains running every 15 minutes during high-traffic hours and every 30 minutes throughout the rest of the day.
                - 'figure "Passengers disembark a FrontRunner at the Intermodal Hub in Salt Lake City on Aug. 7. The Federal Transit Administration approved FrontRunner 2X to enter the Engineering phase of its Capital Investment Grants program, moving the project closer to securing nearly $1.3 billion in federal funding. The project will add 26.1 miles of double track in 11 locations, a new station, 10 trainsets and a new maintenance facility. Once complete, these improvements will support 15-minute service during peak periods and 30-minute service throughout the day. (Photo: Laura Seitz, Deseret News)" [ref=f2278e562]':
                  - generic "Passengers disembark a FrontRunner at the Intermodal Hub in Salt Lake City on Aug. 7. The Federal Transit Administration approved FrontRunner 2X to enter the Engineering phase of its Capital Investment Grants program, moving the project closer to securing nearly $1.3 billion in federal funding. The project will add 26.1 miles of double track in 11 locations, a new station, 10 trainsets and a new maintenance facility. Once complete, these improvements will support 15-minute service during peak periods and 30-minute service throughout the day." [ref=f2278e563] [cursor=pointer]:
                    - img "Passengers disembark a FrontRunner at the Intermodal Hub in Salt Lake City on Aug. 7. The Federal Transit Administration approved FrontRunner 2X to enter the Engineering phase of its Capital Investment Grants program, moving the project closer to securing nearly $1.3 billion in federal funding. The project will add 26.1 miles of double track in 11 locations, a new station, 10 trainsets and a new maintenance facility. Once complete, these improvements will support 15-minute service during peak periods and 30-minute service throughout the day." [ref=f2278e565]
                - paragraph [ref=f2278e567]: "\"The difference between waiting an hour or 15 minutes is a big deal,\" said Utah Sen. John Curtis on Wednesday during a discussion with leaders of the Wasatch Front Regional Council. \"If it's coming every 15 minutes versus every hour, you almost don't even need to check a schedule, right? You know, in your worst case, you're going to be waiting 14 minutes, and that's a very different thing for people than waiting 50 minutes.\""
                - paragraph [ref=f2278e571]: Curtis, known for his use of public transit while serving as the mayor of Provo, has helped move forward several pieces of legislation to support improvement in Utah's public transit. The upcoming open house and Olympics create "a real urgency" for transit renovation, Curtis said during a stop in Salt Lake City.
                - paragraph [ref=f2278e572]: "\"We've done a whole bunch, and there's a lot ahead of us to do,\" Curtis said to the Deseret News. \"The rapid growth that we're expecting as a state, with the temple open house, the Olympics, demands that we get this right. And so part of what we're doing today is looking ahead and making sure that we're not only good for today, but good for the future.\""
                - paragraph [ref=f2278e573]: In addition to supporting an influx of visitors, expansion in public transit could benefit Utah residents both on and off the train tracks.
                - paragraph
                - heading "Public transit development will improve housing affordability in Utah" [level=2] [ref=f2278e574]
                - paragraph
                - 'figure "Sen. John Curtis speaks to leaders from Utah Transit Authority and the Wasatch Front Regional Council at a TRAX platform in Salt Lake City on Wednesday. (Photo: Laura Seitz, Deseret News)" [ref=f2278e575]':
                  - generic "Sen. John Curtis speaks to leaders from Utah Transit Authority and the Wasatch Front Regional Council at a TRAX platform in Salt Lake City on Wednesday." [ref=f2278e576] [cursor=pointer]:
                    - img "Sen. John Curtis speaks to leaders from Utah Transit Authority and the Wasatch Front Regional Council at a TRAX platform in Salt Lake City on Wednesday." [ref=f2278e578]
                - paragraph [ref=f2278e580]:
                  - text: The growth of housing development around public transit, supported by the
                  - link "Build Housing, Unlock Benefits and Services Act" [ref=f2278e581] [cursor=pointer]:
                    - /url: https://www.curtis.senate.gov/press-releases/curtis-blunt-rochester-introduce-bill-to-spur-housing-construction-near-transportation-hubs/
                  - text: ", is expected to boost affordability for Utah residents."
                - paragraph [ref=f2278e582]: "\"I think it's fair to say if we went around the state, we would hear affordability and housing, affordability and housing everywhere we went,\" Curtis said. \"This bill and the other things that we're talking about hit those directly on the head.\""
                - paragraph [ref=f2278e586]: The bill provides funding and speeds up the construction timelines for projects that promote transit-oriented development, a style of city planning that places housing, shopping sites, jobs and entertainment venues near public transit locations.
                - paragraph [ref=f2278e587]: Federal support will bring transit-oriented development "in at an affordable level," Curtis said, because putting residents near public facilities means "all of their costs come down."
                - paragraph [ref=f2278e588]:
                  - text: "\"Utah is growing quickly, and that growth must be paired with smart, coordinated transportation planning and more attainable housing,\" Curtis said"
                  - link "in a press release" [ref=f2278e589] [cursor=pointer]:
                    - /url: https://www.curtis.senate.gov/press-releases/curtis-blunt-rochester-introduce-bill-to-spur-housing-construction-near-transportation-hubs/
                  - text: ", adding that the Build HUBS Act \"helps us maximize transportation investments, makes better use of public land, and empowers local leaders to use existing infrastructure programs more effectively to build housing where it matters and makes sense.\""
                - paragraph
                - heading "Legislation is moving forward to support transit renovation in growing cities" [level=2] [ref=f2278e590]
                - paragraph
                - 'figure "A TRAX train moves past Temple Square in Salt Lake City on Wednesday. (Photo: Laura Seitz, Deseret News)" [ref=f2278e591]':
                  - generic "A TRAX train moves past Temple Square in Salt Lake City on Wednesday." [ref=f2278e592] [cursor=pointer]:
                    - img "A TRAX train moves past Temple Square in Salt Lake City on Wednesday." [ref=f2278e594]
                - paragraph [ref=f2278e596]: The current process for how the federal government evaluates transit projects seeking funding through the Federal Transit Administration's Capital Investment Grants program bases funding on existing population density ridership, meaning cities just starting to grow are at a disadvantage in trying to secure financial support.
                - paragraph [ref=f2278e597]: "\"Ridership numbers don't necessarily reflect the needs of the community,\" Curtis said. \"If it's just strictly rider-based, and ridership is important, then we miss those communities who have done two things: planned and are growing.\""
                - paragraph [ref=f2278e598]:
                  - text: The
                  - link "Promoting Access to Transit in High-Growth Communities Act" [ref=f2278e599] [cursor=pointer]:
                    - /url: https://www.congress.gov/bill/119th-congress/senate-bill/5114/all-info
                  - text: ", introduced by Curtis, moves to reform this process and allow cities that are just starting to grow greater resources to receive funding for proactive construction that matches predicted population growth."
                - paragraph [ref=f2278e600]:
                  - text: Between 2015 and 2025, Utah's population
                  - link "increased by 17.9%" [ref=f2278e601] [cursor=pointer]:
                    - /url: https://usafacts.org/answers/is-the-population-growing-or-shrinking/state/utah/
                  - text: ", according to USA Facts, and the state's population is projected to be"
                  - link "more than 5 million" [ref=f2278e602] [cursor=pointer]:
                    - /url: https://unifiedplan.org/growth-change-in-utah/
                  - text: by 2050, with much of the growth concentrated in urban Wasatch Front areas.
                - paragraph [ref=f2278e603]: "\"We're faced with this enormous growth in the popularity of the state,\" Curtis said. \"And we all know with the Olympics coming that the demands are going to be even higher, which puts pressure on us not just to do what we've done here, but to just keep going.\""
                - paragraph [ref=f2278e604]: Companion legislation for the PATH Act was introduced in the House by Utah Reps. Burgess Owens and Mike Kennedy.
                - paragraph
                - heading "Curtis says transit growth will benefit everyone" [level=2] [ref=f2278e605]
                - paragraph
                - 'figure "Andrew Gruber, executive director of Wasatch Front Regional Council, left, Sen. John Curtis, and Dawn Ramsey, chair of the Wasatch Front Regional Council and the mayor of South Jordan, speak during a meeting with leaders from Utah Transit Authority and WFRC in Salt Lake City on Wednesday. (Photo: Laura Seitz, Deseret News)" [ref=f2278e606]':
                  - generic "Andrew Gruber, executive director of Wasatch Front Regional Council, left, Sen. John Curtis, and Dawn Ramsey, chair of the Wasatch Front Regional Council and the mayor of South Jordan, speak during a meeting with leaders from Utah Transit Authority and WFRC in Salt Lake City on Wednesday." [ref=f2278e607] [cursor=pointer]:
                    - img "Andrew Gruber, executive director of Wasatch Front Regional Council, left, Sen. John Curtis, and Dawn Ramsey, chair of the Wasatch Front Regional Council and the mayor of South Jordan, speak during a meeting with leaders from Utah Transit Authority and WFRC in Salt Lake City on Wednesday." [ref=f2278e609]
                - paragraph [ref=f2278e611]: Curtis said legislation to support transit development will move forward "rather quickly" and produce widespread benefit, even for residents who do not regularly use public transit.
                - paragraph [ref=f2278e615]: "\"Even if people don't like transit, they need to realize that every person that rides transit is a car not on the street, so even if you never use transit, you're one of the beneficiaries of it simply because the other people do,\" Curtis said. \"So let's get it done.\""
