            - article [ref=f1745e548]:
              - generic [ref=f1745e549]:
                - generic [ref=f1745e550]:
                  - text: KEY TAKEAWAYS
                  - img "ChevronUp icon" [ref=f1745e552] [cursor=pointer]
                - list [ref=f1745e554]:
                  - listitem [ref=f1745e555]: The $238 million upgrade of 5600 South and the I-15 interchange with the roadway in Roy is nearly complete.
                  - listitem [ref=f1745e556]: The project stemmed from increasing traffic in the area brought on by growth west of Roy, among other things.
                  - listitem [ref=f1745e557]: Other major road projects are still in the works in western Weber County and northwestern Davis County to address the growing population.
              - generic [ref=f1745e558]:
                - paragraph [ref=f1745e559]: ROY — One of several major road projects in the works along and around I-15 in northern Utah is largely complete, giving western Weber County residents easier access to the interstate.
                - paragraph [ref=f1745e560]:
                  - text: The $238 million upgrade of busy 5600 South in Roy and the I-15 interchange on the eastern end of the roadway is done, save for a few details, after about three years of work. Several other Utah Department of Transportation projects continue, including plans to install a new I-15 intersection to the south at 1800 North near Sunset and Clinton and the extension of the
                  - link "West Davis Corridor" [ref=f1745e561] [cursor=pointer]:
                    - /url: https://www.ksl.com/article/west-davis-corridor-extension-plans-move-ahead-syracuse-eyes-development-along-roadway/51096540?_gl=1*54d2rr*_gcl_aw*R0NMLjE3ODA0MzUyNDguQ2owS0NRandfdm5RQmhDeEFSSXNBRGNaeXhMRHdUdlVMbTRvTUNPd2lCMHA0eFZlVTJQNzNuZGhtbFhZYVQ3ZGtHbFZSSkJrM2xVeURwVWFBZ0RMRUFMd193Y0I.*_gcl_au*MTM4MzM2ODI5LjE3ODA2MDgzNzQ.*_ga*OTE0OTIxOTg1LjE3ODcxNzI4NjM.*_ga_JW89DL7T5D*czE3ODcxNzg4MTkkbzIkZzEkdDE3ODcxODAzMzAkajU1JGwwJGgw
                  - text: northward along the western edge of West Point in Davis County toward Weber County.
                - paragraph [ref=f1745e562]:
                  - text: With continued growth in the West Haven and Hooper areas west of Roy, traffic has grown in recent years along 5600 South, a key access point to I-15. Simultaneously, the growth of the Northrop Grumman complex on the eastern side of the 5600 South/I-15 interchange, where work on the Sentinel missile defense project is being completed, is
                  - link "expanding" [ref=f1745e563] [cursor=pointer]:
                    - /url: https://www.ksl.com/article/northrop-grumman-expands-roy-site-for-sentinel-missile-program-development/51597691?_gl=1*ojkmg2*_gcl_aw*R0NMLjE3ODA0MzUyNDguQ2owS0NRandfdm5RQmhDeEFSSXNBRGNaeXhMRHdUdlVMbTRvTUNPd2lCMHA0eFZlVTJQNzNuZGhtbFhZYVQ3ZGtHbFZSSkJrM2xVeURwVWFBZ0RMRUFMd193Y0I.*_gcl_au*MTM4MzM2ODI5LjE3ODA2MDgzNzQ.*_ga*OTE0OTIxOTg1LjE3ODcxNzI4NjM.*_ga_JW89DL7T5D*czE3ODcxNzg4MTkkbzIkZzEkdDE3ODcxNzk4ODMkajUxJGwwJGgw
                  - text: . An entry to Hill Air Force Base is also located in the area.
                - paragraph [ref=f1745e567]:
                  - text: "\"As growth has continued west of Roy, traffic on 5600 South has increased, particularly during peak commute times. The additional lanes and new interchange should improve traffic flow, reduce congestion and provide safer, more efficient access to I-15 and Hill Air Force Base,\" Roy City Manager Matt Andrews told KSL. A"
                  - link "celebration" [ref=f1745e568] [cursor=pointer]:
                    - /url: https://udotinput.utah.gov/5600south
                  - text: is scheduled for Thursday from 4-6 p.m. at Roy Elementary School at 2888 W. 5600 South to mark the project milestone.
                - 'figure "The $238 million upgrade of 5600 South and the I-15 interchange in Roy, spurred by growth, is largely complete though other major road projects in the area continue. The graphic outlines the project area. (Photo: Utah Department of Transportation)" [ref=f1745e569]':
                  - generic "The $238 million upgrade of 5600 South and the I-15 interchange in Roy, spurred by growth, is largely complete though other major road projects in the area continue. The graphic outlines the project area." [ref=f1745e570] [cursor=pointer]:
                    - img "The $238 million upgrade of 5600 South and the I-15 interchange in Roy, spurred by growth, is largely complete though other major road projects in the area continue. The graphic outlines the project area." [ref=f1745e572]
                - paragraph [ref=f1745e574]: With the expansion of the Roy Innovation Center, where much of the Sentinel work is headquartered, he went on, "we anticipate continued growth and additional traffic in this area. Having this infrastructure in place helps position Roy to accommodate that growth and support future economic development." Northrop Grumman last month broke ground on an expansion of the Roy Innovation Center, which currently employs more than 5,000 people.
                - paragraph [ref=f1745e575]: The work along the two-mile section of 5600 South between I-15 and 3500 West entailed expansion of the section to two lanes of traffic going each way with a center turn lane, up from one lane of traffic each with a turn lane. The I-15 interchange was reconfigured to better accommodate the growing traffic at the spot.
                - paragraph [ref=f1745e576]: UDOT acquired around 60 parcels of land along the southern side of 5600 South to accommodate the expansion and razed the structures on them, mainly single-family homes.
                - 'figure "The photo shows the area of focus of ongoing work to upgrade 1800 North in Clinton and Sunset and build a new interchange where the road meets I-15 to the east. A $238 million upgrade of 5600 South and the I-15 interchange in Roy to the north is largely complete. (Photo: Utah Department of Transportation)" [ref=f1745e577]':
                  - generic "The photo shows the area of focus of ongoing work to upgrade 1800 North in Clinton and Sunset and build a new interchange where the road meets I-15 to the east. A $238 million upgrade of 5600 South and the I-15 interchange in Roy to the north is largely complete." [ref=f1745e578] [cursor=pointer]:
                    - img "The photo shows the area of focus of ongoing work to upgrade 1800 North in Clinton and Sunset and build a new interchange where the road meets I-15 to the east. A $238 million upgrade of 5600 South and the I-15 interchange in Roy to the north is largely complete." [ref=f1745e580]
                - paragraph [ref=f1745e582]: Apart from growth west of Roy in Weber County, more and more people are moving to adjacent northern Davis County in and around West Point, Clinton and Syracuse as well. That dynamic figures in plans to extend the West Davis Corridor, a new major north-south arterial on the western edge of Davis County, toward Weber County. It also figures in the ongoing work to expand 1800 North through Clinton and Sunset to the planned interchange with I-15, where a new entry to Hill Air Force Base is planned.
                - paragraph [ref=f1745e586]: "\"All the growth that's happening in Davis and Weber counties is happening west of I-15,\" said UDOT spokesman Mitch Shaw."
