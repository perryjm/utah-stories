                  - link:
                    - /url: https://www.ksl.com/article/51611327/utahs-10-largest-fires-this-year-have-already-cost-nearly-217m-to-battle
                  - heading [level=2] [ref=f1394e601]:
                    - link "Utah's 10 largest fires this year have already cost nearly $217M to battle" [ref=f1394e602] [cursor=pointer]:
