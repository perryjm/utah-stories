              - generic [ref=f1394e549]:
                - generic [ref=f1394e550]:
                  - text: KEY TAKEAWAYS
                  - img "ChevronUp icon" [ref=f1394e552] [cursor=pointer]
                - list [ref=f1394e554]:
                  - listitem [ref=f1394e555]: The Babylon Fire in Ephraim reached 100% containment after burning 107,189 acres.
                  - listitem [ref=f1394e556]: The U.S. Forest Service lifted the Manti-La Sal National Forest closure on Thursday.
                  - listitem [ref=f1394e557]: Stage two fire restrictions remain, prohibiting campfires and certain equipment use.
              - generic [ref=f1394e558]:
                - paragraph [ref=f1394e559]: EPHRAIM — The Babylon Fire reached 100% containment after burning more than 100,000 acres, prompting the U.S. Forest Service to rescind the special closure area for the Manti-La Sal National Forest on Thursday.
                - paragraph [ref=f1394e560]: The Monticello Ranger District was reopened, meaning all lands within the area are open to the public, according to Forest Service Public Affairs Officer Holly Shyrer.
                - paragraph [ref=f1394e561]:
                  - text: The Babylon Fire
                  - link "began naturally on June 25" [ref=f1394e562] [cursor=pointer]:
                    - /url: https://www.ksl.com/article/51600276/forest-service-determines-what-sparked-utahs-largest-fire-so-far-this-year
                  - text: and burned 107,189 acres before the U.S. Forest Service announced it was
                  - link "100% contained on Friday" [ref=f1394e563] [cursor=pointer]:
                    - /url: https://www.facebook.com/mantilasalnationalforest/posts/pfbid02cKWbhCQ5vXQmTL5Pq6w2CstfL5bXfHhvqFu1nRa1n1HwjkpNkWqohuwSVdcgtY8nl
                  - text: . This does not mean the fire is completely out. Rather, the fire has been surrounded by a
                  - link "combination of natural and man-made firebreaks" [ref=f1394e564] [cursor=pointer]:
                    - /url: https://wfca.com/wildfire-articles/wildfire-articles-wildfire-containment-defined/
                  - text: ", meaning it is unlikely to continue to grow beyond the containment lines."
                - paragraph [ref=f1394e565]: While the land is open for public use, isolated pockets of smoke may still be visible throughout the area. Forest Service personnel will continue to work in the previously closed area to prevent new wildfire starts.
                - paragraph [ref=f1394e569]: Shyrer told KSL it's important to check the weather and have good situational awareness if a person chooses to go into one of these areas.
                - paragraph [ref=f1394e570]: While the roads within the previously closed areas had been cleared of fallen logs, Shyrer said standing dead trees "may be a bit unstable" and fall if a person gets too close.
                - paragraph [ref=f1394e571]:
                  - link "Multiple structures" [ref=f1394e572] [cursor=pointer]:
                    - /url: https://www.ksl.com/article/51583408/4-structures-destroyed-as-crews-continue-to-fight-babylon-fire
                  - text: were lost in the fire, which surpassed 100,000 acres on July 7, becoming the
                  - link "first fire" [ref=f1394e573] [cursor=pointer]:
                    - /url: https://www.ksl.com/article/51595025/babylon-fire-becomes-first-utah-fire-to-reach-100000-acre-mark-in-8-years
                  - text: to do so in eight years. In early July, the Babylon Fire was near the top of the
                  - link "largest active fires list" [ref=f1394e574] [cursor=pointer]:
                    - /url: https://www.ksl.com/article/51594531/nations-new-largest-active-fire-is-also-burning-in-utah
                  - text: in the U.S., per the National Interagency Fire Center.
                - paragraph [ref=f1394e575]:
                  - text: Preliminary research released Aug. 5 from the University of Utah's
                  - link "School of Environment, Society and Sustainability" [ref=f1394e576] [cursor=pointer]:
                    - /url: https://ess.utah.edu/
                  - text: found the Babylon Fire contributed to the
                  - link "nearly 290,000 acres" [ref=f1394e577] [cursor=pointer]:
                    - /url: https://www.ksl.com/article/utah-sets-new-record-for-woodland-area-lost-to-wildfires-by-a-wide-margin-u-researchers-say/51606308
                  - text: of woodland and forested land combined that have already burned this year, more than in any other year on record.
                - paragraph [ref=f1394e578]:
                  - text: The entire Manti-La Sal National Forest remains under
                  - link "stage two fire restrictions" [ref=f1394e579] [cursor=pointer]:
                    - /url: https://www.fs.usda.gov/sites/nfs/files/r04/manti-lasal/publication/alerts/Stage%202%20Manti-La%20Sal_FORESTWIDE_2026.pdf
                  - text: ", which are designed to ensure public safety and reduce the risk of new wildfire starts."
                - paragraph [ref=f1394e580]: "These restrictions prohibit:"
                - paragraph
                - list [ref=f1394e581]:
                  - listitem [ref=f1394e582]: Campfires, charcoal grills, wood stoves, smudge pots and briquette-fueled fires
                  - listitem [ref=f1394e583]: Chainsaws or other internal combustion equipment used for cutting, road work or wood gathering
                  - listitem [ref=f1394e584]: Smoking outdoors
                  - listitem [ref=f1394e585]: Welding, grinding or using open-flame torches
                  - listitem [ref=f1394e586]: Driving or parking off designated routes (unless on bare ground within 10 feet)
                  - listitem [ref=f1394e587]: Exploding targets, fireworks or pyrotechnics
                  - listitem [ref=f1394e588]: Blasting or the use of explosives
                  - listitem [ref=f1394e589]: Tracer or incendiary ammunition
                  - listitem [ref=f1394e590]: Operating engines without proper spark arrestors.
                - paragraph
                - paragraph [ref=f1394e591]: "Other activities are available under the restrictions, including:"
                - paragraph
                - list [ref=f1394e592]:
                  - listitem [ref=f1394e593]: Gas or liquid-fueled stoves, grills or fire pits with on/off switches (with 10 feet of cleared space)
                  - listitem [ref=f1394e594]: Smoking inside an enclosed vehicle or building
                  - listitem [ref=f1394e595]: Parking only in designated areas or on ground completely free of vegetation
                  - listitem [ref=f1394e596]:
                    - text: Activities authorized under
                    - link "Project Activity Levels" [ref=f1394e597] [cursor=pointer]:
                      - /url: https://www.fs.usda.gov/r04/manti-lasal/fire/understanding-project-activity-levels-manti-la-sal-national-forest
                  - listitem [ref=f1394e598]: Official duties by Federal, State or Local emergency personnel
                - paragraph
                - paragraph
                - heading "Other wildfires" [level=2] [ref=f1394e599]
                - paragraph
