                - paragraph
                - heading [level=3] [ref=f1394e603]
                - paragraph
                - paragraph [ref=f1394e604]: More than 500,000 acres across the state have burned during the 2026 Fire Season, according to Utah Fire Info. Several of the season's largest wildfires continue to burn across the state.
                - paragraph
                - list [ref=f1394e605]:
                  - listitem [ref=f1394e606]:
                    - text: The
                    - link "Cottonwood Fire" [ref=f1394e607] [cursor=pointer]:
                      - /url: https://www.ksl.com/article/cottonwood-fire-destroys-southern-utah-ski-resort/51539013?_gl=1*cd1mxh*_gcl_au*MTYxMzQyNDE0LjE3ODUyNDc0MjQ.*_ga*MjI0NjgwNDc5LjE3ODcyMzg0Nzg.*_ga_JW89DL7T5D*czE3ODcyNDEzNTAkbzIkZzEkdDE3ODcyNDcwMDEkajQ2JGwwJGgw
                    - text: ", which began on June 22, has burned 97,464 acres and has reached 95% containment."
                  - listitem [ref=f1394e608]:
                    - text: The
                    - link "Widemouth 2 Fire" [ref=f1394e609] [cursor=pointer]:
                      - /url: https://www.ksl.com/article/incident-involving-aircraft-reported-at-widemouth-2-fire/51607358?_gl=1*qw8i6q*_gcl_au*MTYxMzQyNDE0LjE3ODUyNDc0MjQ.*_ga*MjI0NjgwNDc5LjE3ODcyMzg0Nzg.*_ga_JW89DL7T5D*czE3ODcyNDEzNTAkbzIkZzEkdDE3ODcyNDcwMjMkajI0JGwwJGgw
                    - text: ", which began naturally on July 27, has burned 129,741 acres and has reached 93% containment."
                  - listitem [ref=f1394e610]:
                    - text: The
                    - link "Black Canyon Fire" [ref=f1394e611] [cursor=pointer]:
                      - /url: https://www.ksl.com/article/new-evacuations-ordered-as-black-canyon-fire-grows/51605385?_gl=1*1w3jl9f*_gcl_au*MTYxMzQyNDE0LjE3ODUyNDc0MjQ.*_ga*MjI0NjgwNDc5LjE3ODcyMzg0Nzg.*_ga_JW89DL7T5D*czE3ODcyNDEzNTAkbzIkZzEkdDE3ODcyNDcwODkkajE4JGwwJGgw
                    - text: ", which began naturally on July 30, has burned 3264 acres and has reached 51% containment."
                  - listitem [ref=f1394e612]:
                    - text: The
                    - link "Rocky Canyon Fire" [ref=f1394e613] [cursor=pointer]:
                      - /url: https://www.ksl.com/article/crews-reach-23-containment-of-rocky-canyon-fire-but-over-500-remain-evacuated/51608435?_gl=1*1bl58yf*_gcl_au*MTYxMzQyNDE0LjE3ODUyNDc0MjQ.*_ga*MjI0NjgwNDc5LjE3ODcyMzg0Nzg.*_ga_JW89DL7T5D*czE3ODcyNDEzNTAkbzIkZzEkdDE3ODcyNDcxMDUkajIkbDAkaDA.
                    - text: ", which was human-caused and began on Aug. 7, has burned 16,464 acres and has reached 88% containment."
                  - listitem [ref=f1394e614]:
                    - text: The
                    - link "Dugway Fire" [ref=f1394e615] [cursor=pointer]:
                      - /url: https://www.ksl.com/article/dugway-fire-sparks-near-mouth-of-weber-canyon/51611638?_gl=1*18c1atf*_gcl_au*MTYxMzQyNDE0LjE3ODUyNDc0MjQ.*_ga*MjI0NjgwNDc5LjE3ODcyMzg0Nzg.*_ga_JW89DL7T5D*czE3ODcyNDEzNTAkbzIkZzEkdDE3ODcyNDcxNDkkajIzJGwwJGgw
                    - text: ", which began on Wednesday, has burned approximately 20 acres and has reached 90% containment."
                - paragraph
                - paragraph [ref=f1394e619]: Lucas Minton, wildland fire chief for Weber Fire District, said Thursday the Dugway Fire in Weber Canyon poses "minimal to no threat" to the public. However, he said it will continue to emit smoke as firefighters extinguish burning debris piles inside the burn area.
                - paragraph [ref=f1394e620]: "\"People are going to see that from the interior of the fire but it's in the interior of the fire, no threat,\" Minton said. No damage to structures was reported due to the blaze."
                - paragraph [ref=f1394e621]:
