              - generic [ref=f1067e553]:
                - paragraph [ref=f1067e554]: SALT LAKE CITY — Utah's governor is now a grandfather.
                - paragraph [ref=f1067e555]: Gov. Spencer Cox's first grandchild, Finneas Spencer Cox, was born on Wednesday, the governor confirmed during his monthly news conference.
                - paragraph [ref=f1067e556]: Cox, 51, who is the father of four children, became emotional as he talked about becoming a grandparent for the first time.
                - paragraph [ref=f1067e557]:
                  - text: "\"It was one of the best days of my life,\" he said Thursday, in between answering questions about a variety of topics including"
                  - link "data centers" [ref=f1067e558] [cursor=pointer]:
                    - /url: https://www.ksl.com/article/51611776/utah-has-major-gaps-in-regulating-noise-temperature-from-new-data-centers-agency-head-says
                  - text: ", a now-scuttled large"
                  - link "ICE detention facility" [ref=f1067e559] [cursor=pointer]:
                    - /url: https://www.ksl.com/article/51611923/feds-officially-acknowledge-utah-immigrant-detention-center-plans-have-been-abandoned
                  - text: ", and ongoing"
                  - link "drought" [ref=f1067e560] [cursor=pointer]:
                    - /url: https://www.ksl.com/article/51601041/rain-offers-relief-but-little-help-for-reservoirs-during-drought
                  - text: .
                - paragraph [ref=f1067e561]: The governor acknowledged his mind during the news conference was "totally somewhere else," thinking about his new grandson, and he paused and became teary-eyed as he discussed the child's birth.
                - paragraph [ref=f1067e562]: "\"He had a little hard time breathing when he came out,\" Cox said, \"so those are scary moments, but he's doing great.\""
                - paragraph [ref=f1067e563]:
                  - text: Cox
                  - link "posted" [ref=f1067e564] [cursor=pointer]:
                    - /url: https://x.com/SpencerJCox/status/2090272433655906375?s=20
                  - text: a photo of himself with his grandson on social media Thursday morning, calling it the "purest joy."
                - generic [ref=f1067e567]:
                  - iframe [ref=f1067e569]:
                    - iframe [ref=f1095e11]:
                      
                  - generic [ref=f1067e570]:
                    - generic:
                      - generic:
                        - link "Advertise with us" [ref=f1067e571] [cursor=pointer]:
                          - /url: https://www.deseretdigital.com/advertising
                        - button "Report ad" [ref=f1067e573] [cursor=pointer]
                - paragraph [ref=f1067e574]:
                  - text: Before moving on to other topics, the governor also addressed Utah's
                  - link "declining fertility rates" [ref=f1067e575] [cursor=pointer]:
                    - /url: https://www.ksl.com/article/news/features/family/utah-still-tops-the-nation-in-number-of-children-but-its-lead-is-shrinking/51292703
                  - text: .
                - paragraph [ref=f1067e576]: "\"I hope everybody gets a chance to be a grandparent someday. I really do,\" he said. \"I worry, with the demographic changes in our country, people are getting married later, they're having kids later, or not having kids at all or not getting married at all.\""
                - paragraph [ref=f1067e577]: The governor added, "There's nothing more important than family. It's the most important institution, I think, in our country."
