                - generic [ref=f1235e553]:
                  - text: KEY TAKEAWAYS
                  - img "ChevronUp icon" [ref=f1235e555] [cursor=pointer]
                - list [ref=f1235e557]:
                  - listitem [ref=f1235e558]: A 6-year-old boy saved his younger brother from falling out a window.
                  - listitem [ref=f1235e559]: The boy, Zion, is hospitalized with severe injuries from his own fall.
                  - listitem [ref=f1235e560]: A GoFundMe was started to assist with Zion's medical expenses.
              - generic [ref=f1235e561]:
                - paragraph [ref=f1235e562]: SARATOGA SPRINGS — A 6-year-old boy is being hailed a hero after saving his 4-year-old brother from falling from a two-story window. Sadly, the 6-year-old is in the hospital recovering from serious injuries that resulted from his own fall.
                - paragraph [ref=f1235e563]: The accident happened on Sunday, when the Silva family of Lehi was visiting family for a birthday party. According to father, Carlos Silva, his two sons Leo, 4, and Zion, 6, were in an upstairs bedroom looking at a cousin who was outside.
                - paragraph [ref=f1235e564]: "\"My niece, who witnessed it, said that they were leaning against the window, trying to see her,\" Silva said. \"That's when the screen caved in and Zion fell to the concrete path below.\""
                - paragraph [ref=f1235e565]: Silva recalled rushing to his son's aid, along with his brother who is a nurse practitioner, after they were told of the incident.
                - paragraph [ref=f1235e566]: "\"As a parent, you go into a mode that you hope you never have to go into, but I became very attentive to what he needed,\" Silva said. \"My brother immediately started to assess what was going on, and we could see that there was a wound on (Zion's) forehead and a lot of blood. He was also unconscious for about 30 seconds.\""
                - paragraph [ref=f1235e570]: The ambulance soon came, and Zion was sent via Life Flight to Primary Children's Hospital, where it was found that he had a fractured skull, a separation between his neck and spine, and a broken clavicle.
                - paragraph [ref=f1235e571]: "\"The fracture in his skull is on the right side, and is pretty intense,\" Silva said. \"There are a lot of arteries that pass right by your orbital bone, and all were unscathed — like, none of them were damaged. This was a huge blessing and something that doctors were really concerned about.\""
                - paragraph [ref=f1235e572]: While little Zion was being cared for in the hospital, his little brother started talking more about what happened on Sunday.
                - paragraph [ref=f1235e573]: "\"After the accident, Leo was pretty light about what happened and said, 'Zion is OK. He fell, but he's moving. The police put a band-aid on his head,'\" Silva recalled. \"Over time, (Leo) started to tell family members more and more of what he saw and how he felt.\""
                - paragraph [ref=f1235e574]: That's when the story came out.
                - paragraph [ref=f1235e575]: "\"Leo said, 'Zion saved me. When Zion fell, he pushed me away,'\" Silva recalled while holding back tears."
                - paragraph [ref=f1235e576]: Silva said that when he heard what Zion had done to save his younger brother, it caused his whole family to get emotional.
                - paragraph [ref=f1235e577]: "\"When we found out, we were all a mess,\" he said. \"Everyone has made him cards saying, 'You're a superhero.' It's been really sweet.\""
                - paragraph [ref=f1235e578]: Zion is still in the hospital and has missed his first several days of first grade in a dual immersion classroom, which his dad said he was really excited to start.
                - paragraph [ref=f1235e579]: "\"We're still monitoring things and he's off sedating medication but is still on pain and anti-seizure medication, but things are looking in a good direction,\" Silva said."
                - paragraph [ref=f1235e580]:
                  - text: Friends have set up a
                  - link "GoFundMe" [ref=f1235e581] [cursor=pointer]:
                    - /url: https://www.gofundme.com/f/support-zions-recovery-after-his-fall-e2nz9?attribution_id=sl:80c261af-91e0-49ac-8c46-0f26f4d0f8f8&lang=en_US&ts=1787076563&utm_campaign=fp_sharesheet&utm_content=amp30-no-carousel&utm_medium=customer&utm_source=copy_link
                  - text: "* to help with medical expenses."
