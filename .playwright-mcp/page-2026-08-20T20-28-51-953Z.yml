                  - listitem [ref=f857e99]: Gov. Spencer Cox ordered reviews of license plate cameras amid privacy concerns.
                  - listitem [ref=f857e100]: Cox supports legislation if gaps exist in Utah's camera usage regulations.
                  - listitem [ref=f857e101]: Cox's approval rating dropped to 41% as he addressed multiple state issues.
              - generic [ref=f857e102]:
                - paragraph [ref=f857e103]: SALT LAKE CITY — Amid heightened scrutiny on cameras that automatically track license plates, Utah Gov. Spencer Cox has ordered two state entities to conduct a review and ensure that those cameras are not being misused.
                - paragraph [ref=f857e104]: During his monthly news conference on Thursday, Cox said he was "deeply troubled" by concerns raised by Utah Civic Compact about the frequency with which 10 such cameras owned by Weber County were accessed over several years.
                - paragraph [ref=f857e105]:
                  - iframe [ref=f857e107]:
                    - generic [ref=f861e1]:
                      - generic "YouTube Video Player" [ref=f861e3]
