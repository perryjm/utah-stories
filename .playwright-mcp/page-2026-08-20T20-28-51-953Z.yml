                                  - generic [ref=f861e43]: Watch on
                - paragraph [ref=f857e108]: The group released public information from the Weber County Sheriff's Office that showed that since early 2022, those cameras were searched more than 5 million times, mostly by out-of-state law enforcement agencies.
                - paragraph [ref=f857e109]: Often called Flock cameras, hundreds of them line the Wasatch Front and other parts of the state. Police tout them as effective in finding suspect vehicles and investigating crimes. But opponents say they lead to government surveillance and an invasion of privacy. Many of the automatic license plate reader cameras are owned by a company called Flock Safety.
                - paragraph [ref=f857e113]: In response to concerns, Cox said he has ordered the Utah Privacy Governing Board and the Utah Privacy Commission to take a closer look.
                - paragraph [ref=f857e114]: "\"I've asked them to do a review of all of our rules and regulations around these cameras,\" the governor said, \"especially how they're being used with local agencies to make sure that they are not being abused.\""
                - paragraph [ref=f857e115]: Cox added that he wants the public to understand how and when those cameras are used and, if abuse takes place, that people are held accountable.
                - paragraph [ref=f857e116]: "\"We're not going to allow that here,\" he said."
                - paragraph
                - heading "New legislation needed?" [level=2] [ref=f857e117]
                - paragraph
                - paragraph [ref=f857e118]:
                  - text: Last week, in releasing the public information about
                  - link "the Weber County cameras" [ref=f857e119] [cursor=pointer]:
                    - /url: https://www.ksl.com/article/51609507/group-cites-striking-weber-county-data-on-flock-cameras-as-reason-for-lawmakers-to-act
                  - text: ", Utah Civic Compact leaders urged state lawmakers to tighten Utah code to ensure that out-of-state agencies follow the rules Utah has set for accessing and using data from those cameras."
                - paragraph [ref=f857e120]: Cox insisted Utah law already has guardrails in place around the use of those cameras, but he questioned whether it was being followed.
                - paragraph [ref=f857e121]: "\"If there are some gaps, then yes, I would absolutely support legislation,\" Cox said, \"but I think the legislation we have in place should allow us to protect people's privacy and make sure they're not being abused.\""
                - paragraph [ref=f857e122]: Utah lawmakers considered a bill in 2025 that would have further regulated automatic license plate readers, but it failed to pass before the session ended. Another related bill in 2026 did not receive a hearing.
                - paragraph
                - heading "Other topics" [level=2] [ref=f857e123]
                - paragraph
                - paragraph [ref=f857e124]: It was Cox's first PBS Utah news conference this summer and the first since several Republican incumbents in the state lost their seats amid a growing anti-incumbency movement in the June primary elections.
                - paragraph [ref=f857e125]: Cox was also recently underwater with voters in an approval poll by Deseret News and the Hinckley Institute of Politics this week. That poll, which shows his approval rating at 41% compared to 51% in January, marks the first time the governor has had a negative approval rating, but continues a recent downward trend.
                - paragraph [ref=f857e126]:
                  - text: During the news conference, the governor touched on several other topics, including regulating data centers in Utah, the state's
                  - link "ongoing drought and water supply" [ref=f857e127] [cursor=pointer]:
                    - /url: www.ksl.com/article/51614315
                  - text: issues, how leaders are working to prevent large wildfires, and gas and housing prices.
                - paragraph [ref=f857e131]:
                  - text: Cox also revealed he
                  - link "became a grandfather" [ref=f857e132] [cursor=pointer]:
                    - /url: https://www.ksl.com/article/51614352/utah-gov-spencer-cox-becomes-grandfather-for-first-time?bust=1
                  - text: this week for the first time.
                - paragraph [ref=f857e133]:
                  - text: You can watch the governor's full news conference on the
                  - link "KSL YouTube page" [ref=f857e134] [cursor=pointer]:
                    - /url: https://www.youtube.com/watch?v=NSqsWHWAnF0
