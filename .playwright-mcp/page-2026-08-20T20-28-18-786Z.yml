                - paragraph
                - paragraph [ref=f505e134]: Utah, Danly said, is particularly ripe for critical mineral production.
                - paragraph [ref=f505e135]: "\"Eighty percent of the list of critical minerals are here one way or another in deposits in the state,\" Danly said. \"I think Utah is likely to be one of the leaders in critical mineral efforts simply because of the natural resources and the willingness of the state to partner with the federal government.\""
                - paragraph [ref=f505e136]: Of course, with the freshly announced lithium extraction and refining facility's positioning on the shore of the Great Salt Lake, both water use and contamination are potential areas of concerns.
                - paragraph [ref=f505e137]: According to the Department of Energy's grant announcement, the facility will return processed brine "back to the lake with no net water loss."
                - paragraph [ref=f505e138]: Environmental Protection Agency Deputy Administrator David Fotouhi said the agency has been working closely with the state "on all issues related to the Great Salt Lake."
