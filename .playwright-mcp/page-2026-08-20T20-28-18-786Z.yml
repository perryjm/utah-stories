                  - text: KEY TAKEAWAYS
                  - img "ChevronUp icon" [ref=f505e104] [cursor=pointer]
                - list [ref=f505e106]:
                  - listitem [ref=f505e107]: The U.S. Department of Energy awarded $100 million to Waterleaf P1 HoldCo to develop a lithium extraction and refining facility near the Great Salt Lake.
                  - listitem [ref=f505e108]: The project aims to double U.S. lithium production reducing reliance on foreign sources.
                  - listitem [ref=f505e109]: Utah is poised to lead in critical minerals with 80% of critical minerals present in the state.
              - generic [ref=f505e110]:
                - paragraph [ref=f505e111]: SALT LAKE CITY — The U.S. Department of Energy on Thursday announced Waterleaf P1 HoldCo, a subsidiary of California-based Lilac Solutions, was awarded a $100 million federal grant to build and operate a commercial lithium extraction and refining facility on the Great Salt Lake's northeastern shore.
                - paragraph [ref=f505e112]:
                  - text: The project was one of seven selected to receive funding from a $500 million grant pool administered by the department to "expand critical mineral and material processing, battery manufacturing, and recycling capacity in the United States," according to a department
                  - link "release" [ref=f505e113] [cursor=pointer]:
                    - /url: https://www.energy.gov/articles/energy-department-announces-500-million-secure-americas-critical-mineral-and-battery
                  - text: .
                - paragraph [ref=f505e114]: The first phase of the projects aims to double current U.S. lithium production and set the groundwork for future expansion, the department said.
                - paragraph [ref=f505e115]: With the U.S. rapidly expanding domestic sources of critical minerals in hopes of reducing reliance on foreign sources, Utah is not just following suit but positioning itself to be a domestic leader in the critical minerals race.
                - paragraph [ref=f505e116]:
                  - text: In January, Utah Gov. Spencer Cox announced the
                  - link "launch of \"Mission Critical\"" [ref=f505e117] [cursor=pointer]:
                    - /url: https://www.deseret.com/politics/2026/01/20/utah-legislature-and-governor-propose-plan-to-break-up-china-dominance-on-critical-minerals/
                  - text: to reduce America's dependence on China for materials essential to national security and to make the Beehive State the top destination for critical mineral extraction and processing.
                - generic [ref=f505e120]:
                  - iframe [ref=f505e122]:
                    - iframe [ref=f535e11]:
                      
                  - generic [ref=f505e123]:
                    - generic:
                      - generic:
                        - link "Advertise with us" [ref=f505e124] [cursor=pointer]:
                          - /url: https://www.deseretdigital.com/advertising
                        - button "Report ad" [ref=f505e126] [cursor=pointer]
                - paragraph [ref=f505e127]:
                  - text: China controls over 90% of the world's refinery production of key components in electronics, according to
                  - link "data" [ref=f505e128] [cursor=pointer]:
                    - /url: https://www.instituteforenergyresearch.org/international-issues/china-will-remain-the-worlds-dominant-critical-mineral-processing-supplier-through-2030/
                  - text: from the Institute for Energy Research. The country also produces about 70% of the world's rare earth elements and more than 60% of global titanium mining and aluminum smelter production.
                - paragraph [ref=f505e129]:
                  - text: And the statewide push continued in April when the University of Utah's board of trustees voted to establish the
                  - link "Institute for Critical and Strategic Minerals" [ref=f505e130] [cursor=pointer]:
                    - /url: https://attheu.utah.edu/facultystaff/u-announces-new-institute-for-critical-and-strategic-minerals/
                  - text: .
                - paragraph [ref=f505e131]: "\"The overall plan and strategy is deceptively simple, which is trying to onshore as much of the critical minerals extraction, processing and commercial availability as possible in the United States. Lithium is obviously one of the most important critical minerals, and we've had trouble over time getting fully domestic production of lithium,\" Department of Energy Deputy Secretary James Danly told reporters Thursday during a press conference in Salt Lake City."
