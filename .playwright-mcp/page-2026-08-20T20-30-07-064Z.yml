                - list [ref=f1867e554]:
                  - listitem [ref=f1867e555]: Utah lacks regulations for noise and temperature impacts from new data centers, an agency head told lawmakers.
                  - listitem [ref=f1867e556]: Tim Davis, commissioner of environmental quality, highlighted gaps in permitting on heat and noise generated by data centers.
                  - listitem [ref=f1867e557]: A lawmaker expressed concern about lack of clarity over who is accountable for approving new data center developments.
              - generic [ref=f1867e558]:
                - paragraph [ref=f1867e559]: SALT LAKE CITY — An agency leader said there are "major gaps" in Utah's regulation of data center development, particularly when it comes to the impacts new projects will have on local temperatures and noise.
                - paragraph [ref=f1867e560]: Tim Davis, the commissioner of the Utah Department of Environmental Quality, told lawmakers Wednesday that the controversial large data center proposed in Box Elder County has yet to begin the process of getting air quality permits, and said projects that might increase pollution along the Wasatch Front will struggle to get approved.
                - paragraph [ref=f1867e561]: "\"Along the Wasatch Front ... we're already out of compliance with the Clean Air Act, specifically for ozone,\" he told the Economic Development and Workforce Services Interim Committee Wednesday. \"It would be difficult, if not impossible, for a major new natural gas source to generate along the Wasatch Front. ... If they go off of the Wasatch Front — that's where we're really trying to steer these projects that are generating natural gas.\""
                - paragraph [ref=f1867e565]:
                  - text: Davis spoke at one of three separate meetings on Capitol Hill Wednesday to discuss data center development, in light of a broad uproar over the Stratos Project Area in Box Elder County, which contributed to several elected officials
                  - link "being unseated" [ref=f1867e566] [cursor=pointer]:
                    - /url: https://www.ksl.com/article/51540078/how-a-data-center-helped-topple-one-of-utahs-most-powerful-lawmakers
                  - text: in
                  - link "primary elections" [ref=f1867e567] [cursor=pointer]:
                    - /url: https://www.ksl.com/article/51538423/stuart-adams-trevor-lee-dan-mccay-lose-reelection-bids-in-utah-legislature
                  - text: earlier this summer.
                - paragraph
                - iframe [ref=f1867e569]:
                  - application "Video Player - Utah has 'major gaps' in regulating noise, temperature from new data centers, agency head says" [ref=f1868e2]:
                    - generic [ref=f1868e4]:
                      - generic [ref=f1868e6] [cursor=pointer]
                      - generic [ref=f1868e8]: 0 seconds of 1 minute, 49 secondsVolume 0%
                - text: Daniella Rivera, KSL
                - paragraph
                - paragraph [ref=f1867e570]:
                  - text: Jake Garfield, deputy director of the Utah Office of Energy Development, praised Utah's law passed in 2025 requiring
                  - link "large data centers" [ref=f1867e571] [cursor=pointer]:
                    - /url: https://www.ksl.com/article/news/business/is-a-data-center-vibe-shift-upon-us/51608185
                  - text: to find alternative power sources besides connecting to the rest of the power grid.
                - paragraph [ref=f1867e572]: He called the law an "American-leading piece of data center legislation as it's protecting ratepayers and ensuring that large loads pay for the cost of that, that they are not putting their costs on ratepayers."
                - paragraph [ref=f1867e573]: Utah lawmakers also approved a bill earlier this year regulating water use for new data center developments.
                - paragraph [ref=f1867e574]:
                  - text: But the state doesn't currently have regulations in place governing how much noise
                  - link "data centers" [ref=f1867e575] [cursor=pointer]:
                    - /url: https://www.ksl.com/article/51608196/new-data-centers-present-opportunities-and-challenges-to-utahs-tax-system-researcher-says
                  - text: can produce or how much heat they can emit, according to Davis. Large data centers that rely on natural gas or other fuel sources may dramatically increase temperatures in nearby areas, according to
                  - link "researchers" [ref=f1867e576] [cursor=pointer]:
                    - /url: https://www.ksl.com/article/news/utah/proposed-mega-data-center-draws-concerns-over-heat-island-effect/51591529
                  - text: .
                - paragraph [ref=f1867e577]: Heat and noise are among the "major gaps" in the state's approach to data center permitting, Davis said, and they're issues that he plans to examine with help from state universities and other agencies.
                - paragraph [ref=f1867e578]: "\"That is one of the other issues, in addition to heat, that I've talked about with ... universities to address,\" he said, when asked about the amount of noise data centers can generate. \"We don't have noise regulatory authority. ... Putting things that are compatible next to each other is important. I've had multi-million dollar homes sited right next to an existing landfill and you can imagine the people who live in those houses are not happy about the smells of the landfill, even though the landfill was there first.\""
                - paragraph [ref=f1867e579]: Officials said they still don't have full clarity on the plans for the Stratos Project Area, which is backed by celebrity investor Kevin O'Leary. Davis said that project still has several hurdles to clear and said he has not met with O'Leary's team, but has extended an invitation.
                - heading "Related:" [level=2] [ref=f1867e583]
                - generic [ref=f1867e584]:
                  - link:
                    - /url: https://www.ksl.com/article/51611520/residents-voice-concerns-over-proposed-data-center-regulations-in-spanish-fork
                  - heading [level=2] [ref=f1867e585]:
                    - link "Residents voice concerns over self-powered data center proposal in Spanish Fork" [ref=f1867e586] [cursor=pointer]:
                      - /url: https://www.ksl.com/article/51611520/residents-voice-concerns-over-proposed-data-center-regulations-in-spanish-fork
                  - text: The Spanish Fork City Council debated potential data center regulations during a meeting Tuesday.
                - paragraph [ref=f1867e587]: "\"I ask any company (that) wants to do anything ... come and talk to us early so that we can help figure out how,\" he said. \"I have invited them to come sit down with us on air quality. They've not done it. So we have not even started our process.\""
                - paragraph [ref=f1867e588]: He also stressed that multiple agencies are involved in approving data center projects and no single agency has complete power to approve a new development.
                - paragraph [ref=f1867e589]: But that presented its own set of concerns from Rep. Doug Fiefia, R-Herriman.
                - paragraph [ref=f1867e590]: "\"If no single agency approves a data center, then who's accountable when something falls through the cracks?\" he asked."
                - paragraph [ref=f1867e591]: "\"If there's a million people I have to contact, well, then I never really get to the right person that I have a question or concern to,\" he added. \"That's the concern I have from constituents is there's a lot of hands in the kitchen, and we don't know who's responsible for what.\""
                - paragraph [ref=f1867e592]: Davis said the state is looking at ways to coordinate better.
                - paragraph [ref=f1867e593]: "\"That's something we recognize that we can do,\" he said. \"We haven't talked about it as much in the back end, but that's something we can certainly do going forward.\""
                - paragraph [ref=f1867e594]: Wednesday's hearings on data center policy may not lead to any immediate changes, but will likely shape future policy on development when lawmakers return for their annual general session in January.
                - paragraph [ref=f1867e595]:
                  - strong [ref=f1867e596]: "Contributing:"
                  - text: Daniella Rivera
