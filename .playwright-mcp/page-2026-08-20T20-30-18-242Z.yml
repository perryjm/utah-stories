              - generic [ref=f2121e549]:
                - generic [ref=f2121e550]:
                  - text: KEY TAKEAWAYS
                  - img "ChevronUp icon" [ref=f2121e552] [cursor=pointer]
                - list [ref=f2121e554]:
                  - listitem [ref=f2121e555]: A handful of Sugar House businesses opposed proposed special assessment area during protest hearing.
                  - listitem [ref=f2121e556]: Business owners argue the fees won't benefit them amid ongoing financial struggles.
                  - listitem [ref=f2121e557]: Approval requires support from 60% of business property value in the area.
              - generic [ref=f2121e558]:
                - paragraph [ref=f2121e559]: SALT LAKE CITY — A Sugar House business-led plan to create a special assessment area within the heart of the Salt Lake City neighborhood's business district is facing some pushback from other Sugar House businesses.
                - paragraph [ref=f2121e560]:
                  - text: A handful of business owners attended a protest hearing on Tuesday, which is part of the lengthy and complicated process initiated by the Sugar House Chamber of Commerce
                  - link "earlier this year" [ref=f2121e561] [cursor=pointer]:
                    - /url: https://www.ksl.com/article/51503892/sugar-house-chamber-seeks-special-assessment-to-spur-new-events-signage-and-lighting
                  - text: .
                - paragraph [ref=f2121e562]: The proposal calls for a small tax-like collection from commercial properties within the district that can fund new events, signage and holiday lighting used throughout the district, as well as public safety ambassadors and other services. It's similar to a district in downtown, which created the Downtown Alliance.
                - paragraph [ref=f2121e563]: The proposed district would span from 700 East to 1300 East, and Ramona Avenue and as far south as I-80. While proponents say it could help boost activity in the area, business owners who attended the Salt Lake City Council meeting argued against it.
                - paragraph [ref=f2121e567]: Some said they don't believe their businesses should be included in the assessment district because they're not sure their office buildings and commercial services would benefit from potential services.
                - paragraph [ref=f2121e568]: Many businesses are still struggling from the impacts of wholesale road and utility repairs that ended last year, said Melva Sine, president and CEO of the Utah Restaurant Association. She said she was asked by members to speak, saying that surviving restaurants have exhausted their reserves and don't believe the new road configuration has helped with traffic.
                - paragraph [ref=f2121e569]: All of it comes as labor costs, wholesale food prices, rent and other expenses are up, which is why she said businesses need hardship grants and not new assessment fees.
                - paragraph [ref=f2121e570]: "\"Recovery is not finished in the Sugar House area,\" Sine said. \"These businesses are still struggling. ... We feel like we need to have support for the Sugar House area, but we don't feel like — and the restaurants don't feel like — they should be paying for something and fixing a problem they didn't create.\""
                - paragraph [ref=f2121e571]: The construction project to improve 1100 East/Highland Drive within the area began in 2023. A section project targeting 2100 South ended last year, and the two overlapped at one point.
                - paragraph [ref=f2121e572]: Construction carried on for so long that it drove customers away, said Jeff Goddard, owner of Gutherie Bicycle. He doesn't see how events would get people to his business unless it's getting people to know that construction is over.
                - paragraph [ref=f2121e573]: "\"I don't see this exorbitant amount of fees to the existing businesses is really going to help us stay open,\" he said."
                - heading "Related:" [level=2] [ref=f2121e574]
                - generic [ref=f2121e575]:
                  - link:
                    - /url: https://www.ksl.com/article/51503892/sugar-house-chamber-seeks-special-assessment-to-spur-new-events-signage-and-lighting
                  - heading [level=2] [ref=f2121e576]:
                    - link "Sugar House chamber seeks special assessment to spur new events, signage and lighting" [ref=f2121e577] [cursor=pointer]:
                      - /url: https://www.ksl.com/article/51503892/sugar-house-chamber-seeks-special-assessment-to-spur-new-events-signage-and-lighting
                  - text: Sugar House business leaders are exploring a new way to fund and promote the business district through a concept Salt Lake City first used in 1991.
                - paragraph [ref=f2121e578]: Sugar House Chamber of Commerce officials told KSL in the spring that they want to create an entity that could oversee farmers' markets, food festivals and other events that draw people to Sugar House, building on how they celebrated the end of construction in 2025 and mirroring the Downtown Alliance.
                - paragraph [ref=f2121e579]: If approved, one assessment would go toward that, while another would focus on signage and holiday lighting, which could also draw people to the district, beginning as early as 2027.
                - paragraph [ref=f2121e583]: "\"We just think it will solve a whole lot of problems, including dealing with a growing number of people who are in the neighborhood, patronizing the different stores, shops, bars and restaurants, along with creating a heightened sense of vibrancy,\" said James Roberts, co-chairman of the Sugar House Chamber of Commerce, at the time."
                - 'figure "A map of the proposed Sugar House special assessment area. The commercial buildings in red would be assessed a small tax that would go toward promotion of the area, if approved. (Photo: Salt Lake City Department of Economic Developement)" [ref=f2121e584]':
                  - generic "A map of the proposed Sugar House special assessment area. The commercial buildings in red would be assessed a small tax that would go toward promotion of the area, if approved." [ref=f2121e585] [cursor=pointer]:
                    - img "A map of the proposed Sugar House special assessment area. The commercial buildings in red would be assessed a small tax that would go toward promotion of the area, if approved." [ref=f2121e587]
                - paragraph [ref=f2121e589]: It's unclear how the negative sentiment from the protest period will affect the 48-step process since it began.
                - paragraph [ref=f2121e590]: Salt Lake City Councilwoman Sarah Young, who represents the Sugar House neighborhood, pointed out that the protest hearing is only part of the process, and the final decision won't be made by the Salt Lake City Council.
                - paragraph [ref=f2121e591]: It's up to business owners to create the assessment area and determine the services that would be provided. Support from at least 60% of the business property value within the area is needed to designate the Sugar House Business District, among other things.
                - paragraph [ref=f2121e592]: "\"Ultimately, this is a decision that is made by those who would be impacted. It's not a decision that's made exclusively up here by the councilmembers,\" Young said on Tuesday."
